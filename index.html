<title>APWA Northern Branch Cards</title>

<style>
/* Layout: logo masthead, scrollable name tabs, one contact card at a time with two scan codes */
:root{--bg:#EEF1F6;--surface:#FFFFFF;--fg:#14233F;--muted:#5A6882;--line:#D5DCE8;--navy:#1B3A6B;--accent:#D9481F;--teal:#0E8FB0;--chip:#E1E7F1;--chipfg:#1B3A6B;
--display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1626;--surface:#16233A;--fg:#E8EDF6;--muted:#9AA9C4;--line:#2A3A58;--navy:#8FB1EA;--accent:#FF7A4D;--teal:#3CC0E0;--chip:#1F3050;--chipfg:#CFDDF7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1626;--surface:#16233A;--fg:#E8EDF6;--muted:#9AA9C4;--line:#2A3A58;--navy:#8FB1EA;--accent:#FF7A4D;--teal:#3CC0E0;--chip:#1F3050;--chipfg:#CFDDF7;color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
.mast{background:#fff;border-radius:0 0 18px 18px;padding:18px 16px 14px;display:flex;justify-content:center;border-bottom:4px solid var(--teal)}
.mast img{width:min(100%,300px);height:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin}
.tabs a{flex:none;text-decoration:none;background:var(--chip);color:var(--chipfg);font-weight:600;font-size:14px;padding:8px 13px;border-radius:999px;white-space:nowrap}
.tabs a[aria-current="true"]{background:var(--navy);color:var(--bg)}
.tabs a:focus-visible,button:focus-visible,.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:10px}
.role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent)}
h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:44px;line-height:1;margin:6px 0 2px;color:var(--navy);text-wrap:balance}
.cred{font-weight:500;color:var(--muted);font-size:15px}
.org{margin:10px 0 0;font-weight:600}
.addr{margin:2px 0 0;color:var(--muted);font-size:14px}
.rows{display:grid;gap:10px;margin-top:18px}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row .v{font-weight:500;overflow-wrap:anywhere;min-width:0}
.row .t{flex:1;min-width:0}
.act,button.copy{flex:none;font:inherit;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--navy);background:transparent;color:var(--navy);padding:6px 10px;text-decoration:none;cursor:pointer}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.qr{text-align:center;min-width:0}
.qr .tile{background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line)}
.qr img{display:block;width:100%;height:auto}
.qr h2{font-size:14px;margin:10px 0 2px;font-weight:600}
.qr p{margin:0;font-size:12.5px;color:var(--muted)}
.foot{margin:18px 4px 0;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:420px){.qrs{grid-template-columns:1fr}h1{font-size:38px}}
</style>
</head><body>

function render(m){

  <div class="role">${esc(m.role)} · Northern Branch</div>
  <h1>${esc(m.name)}</h1>${m.cred?`<div class="cred">${esc(m.cred)}</div>`:''}
  <p class="org">${esc(m.org)}</p>${m.addr?`<p class="addr">${esc(m.addr)}</p>`:''}
  <div class="rows">${rows.map(r=>`<div class="row"><div class="t"><div class="k">${r[0]}</div><div class="v">${esc(r[1])}</div></div><a class="act" href="${esc(r[2])}">${r[3]}</a><button class="copy" type="button" data-c="${esc(r[1])}">Copy</button></div>`).join('')}</div>
  <div class="qrs">
   <div class="qr"><div class="tile"><img src="${m.vcf}" alt="QR code that saves ${esc(m.name)} to contacts"></div><h2>Save contact</h2><p>Scan with the phone camera, then tap Add Contact.</p></div>
   <div class="qr"><div class="tile"><img src="${LISTQR}" alt="QR code to join the Northern Nevada Branch listserv"></div><h2>Join the listserv</h2><p>Scan to open a pre-written email to Randy.</p></div>
  </div></article>`;
  
}
function go(){render(cur())}
addEventListener('hashchange',go);
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-s]');
  if(a){e.preventDefault();try{history.replaceState(null,'','#'+a.dataset.s)}catch(_){}render(M.find(m=>m.slug===a.dataset.s));return}
  const b=e.target.closest('button.copy');
  if(b){const t=b.dataset.c;const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400)};
   (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(b.closest('.row').querySelector('.v'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'})}
});
go();
</script>

</body></html>
